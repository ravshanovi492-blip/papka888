
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishchilar boshqaruv tizimi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🏢 ISHCHILAR BOSHQARUV TIZIMI</h1>
    <p>Korxona xodimlari boshqaruvi</p>
</header>

<main class="container">

    <section class="form-box">
        <h2 id="formTitle">➕ Yangi ishchi qo‘shish</h2>

        <form id="workerForm">

            <label>Ishchi rasmi</label>
            <input type="file" id="photo" accept="image/*">

            <label>Ismi</label>
            <input type="text" id="firstName" placeholder="Ismini yozing" required>

            <label>Familiyasi</label>
            <input type="text" id="lastName" placeholder="Familiyasini yozing" required>

            <label>Yoshi</label>
            <input type="number" id="age" min="1" max="120" placeholder="Yoshi" required>

            <label>Tug‘ilgan sana</label>
            <input type="date" id="birth" required>

            <label>Yashash tumani</label>
            <input type="text" id="district" placeholder="Masalan: Chilonzor" required>

            <label>Lavozimi</label>
            <input type="text" id="job" placeholder="Lavozimi" required>

            <button type="submit" id="submitBtn">+ Ishchini qo‘shish</button>
            <button type="button" id="cancelBtn" class="cancel-btn" hidden>
                Bekor qilish
            </button>

        </form>
    </section>

    <section class="table-box">
        <h2>📋 Ishchilar ro‘yxati</h2>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Rasm</th>
                        <th>Ism</th>
                        <th>Familiya</th>
                        <th>Yosh</th>
                        <th>Tug‘ilgan sana</th>
                        <th>Tuman</th>
                        <th>Lavozim</th>
                        <th>Amallar</th>
                    </tr>
                </thead>

                <tbody id="workerList"></tbody>
            </table>
        </div>

        <p id="emptyMessage">Hozircha ishchilar mavjud emas.</p>
    </section>

</main>

<footer>
    © 2026 Ishchilar boshqaruv tizimi
</footer>

<script src="script.js"></script>
</body>
</html>
